<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — Boda Javier & Rocío</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #faf7f2;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #8b5e3c;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px 30px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      min-width: 130px;
    }

    .stat-card .number {
      font-size: 2.2rem;
      font-weight: bold;
      color: #8b5e3c;
    }

    .stat-card .label {
      font-size: 0.8rem;
      color: #999;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: #8b5e3c;
      color: white;
    }

    .btn-primary:hover {
      background: #7a5234;
    }

    .btn-secondary {
      background: white;
      color: #8b5e3c;
      border: 1px solid #8b5e3c;
    }

    .btn-secondary:hover {
      background: #fdf0e0;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .filter-btn.active {
      background: #8b5e3c;
      color: white;
      border-color: #8b5e3c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    thead {
      background: #8b5e3c;
      color: white;
    }

    th,
    td {
      padding: 12px 14px;
      text-align: left;
      font-size: 0.88rem;
    }

    tbody tr:nth-child(even) {
      background: #fdf7f0;
    }

    tbody tr:hover {
      background: #fde8cc;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-si {
      background: #d4edda;
      color: #155724;
    }

    .badge-no {
      background: #f8d7da;
      color: #721c24;
    }

    .badge-pend {
      background: #fff3cd;
      color: #856404;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 1rem;
    }

    #error-msg {
      text-align: center;
      padding: 20px;
      color: #c0392b;
      background: #fdecea;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 700px) {
      table {
        font-size: 0.78rem;
      }

      th,
      td {
        padding: 8px 8px;
      }

      .hide-mobile {
        display: none;
      }
    }
  </style>
</head>

<body>

  <h1>💍 Panel de Confirmaciones</h1>
  <p class="subtitle">Boda Javier & Rocío — actualiza para ver los últimos datos</p>

  <div id="error-msg"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="number" id="stat-total">—</div>
      <div class="label">Total respuestas</div>
    </div>
    <div class="stat-card">
      <div class="number" id="stat-asisten">—</div>
      <div class="label">Confirman asistencia</div>
    </div>
    <div class="stat-card">
      <div class="number" id="stat-no">—</div>
      <div class="label">No asisten</div>
    </div>
    <div class="stat-card">
      <div class="number" id="stat-pendiente">—</div>
      <div class="label">Pendientes</div>
    </div>
    <div class="stat-card">
      <div class="number" id="stat-personas">—</div>
      <div class="label">Personas totales</div>
    </div>
    <div class="stat-card">
      <div class="number" id="stat-ninos">—</div>
      <div class="label">Niños</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="cargarDatos()">🔄 Actualizar</button>
    <button class="btn btn-secondary" onclick="exportarCSV()">📥 Exportar CSV</button>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filtrar('todos', this)">Todos</button>
    <button class="filter-btn" onclick="filtrar('Sí, asistiré', this)">✅ Asisten</button>
    <button class="filter-btn" onclick="filtrar('No podré asistir', this)">❌ No asisten</button>
    <button class="filter-btn" onclick="filtrar('No lo he decidido aún', this)">⏳ Pendientes</button>
  </div>

  <div id="loading">Cargando confirmaciones...</div>

  <div id="tabla-container" style="display:none; overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Nombre</th>
          <th>Asistencia</th>
          <th class="hide-mobile">Acompañante</th>
          <th class="hide-mobile">Nombre Acomp.</th>
          <th>Niños</th>
          <th class="hide-mobile">Restricciones</th>
          <th class="hide-mobile">Mensaje</th>
        </tr>
      </thead>
      <tbody id="tabla-body"></tbody>
    </table>
  </div>

  <script>
    // ⚠️ CAMBIA ESTA URL POR LA DE TU APPS SCRIPT
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQc96If2L49s79q1IElj2udaX0t3k_GgJcUSpzIJTJcnWuPXla2YBcvVbduDXc15Ae/exec";

    let todosLosDatos = [];
    let filtroActual = "todos";

    async function cargarDatos() {
      document.getElementById("loading").style.display = "block";
      document.getElementById("tabla-container").style.display = "none";
      document.getElementById("error-msg").style.display = "none";

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        if (!res.ok) throw new Error("Error HTTP: " + res.status);
        const json = await res.json();
        todosLosDatos = json.confirmaciones || [];
        renderTabla(todosLosDatos);
        actualizarStats(todosLosDatos);
      } catch (err) {
        document.getElementById("error-msg").textContent =
          "⚠️ No se pudieron cargar los datos. Comprueba que el Apps Script está publicado correctamente. Error: " + err.message;
        document.getElementById("error-msg").style.display = "block";
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function renderTabla(datos) {
      const tbody = document.getElementById("tabla-body");
      if (datos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#aaa;padding:30px">Sin confirmaciones aún</td></tr>';
      } else {
        tbody.innerHTML = datos.map(function (r) {
          const asistencia = r["Asistencia"] || "";
          let badgeClass = "badge-pend";
          if (asistencia.includes("Sí") || asistencia.includes("asistiré")) badgeClass = "badge-si";
          if (asistencia.includes("No podré")) badgeClass = "badge-no";

          return `<tr>
          <td>${r["Fecha"] || ""}</td>
          <td><strong>${r["Nombre"] || ""}</strong></td>
          <td><span class="badge ${badgeClass}">${asistencia}</span></td>
          <td class="hide-mobile">${r["Acompañante"] || ""}</td>
          <td class="hide-mobile">${r["Nombre Acompañante"] || ""}</td>
          <td>${r["Niños"] || "0"}</td>
          <td class="hide-mobile">${r["Restricciones"] || "—"}</td>
          <td class="hide-mobile">${r["Mensaje"] || "—"}</td>
        </tr>`;
        }).join("");
      }
      document.getElementById("tabla-container").style.display = "block";
    }

    function actualizarStats(datos) {
      const total = datos.length;
      const asisten = datos.filter(r => (r["Asistencia"] || "").includes("asistiré")).length;
      const no = datos.filter(r => (r["Asistencia"] || "").includes("No podré")).length;
      const pend = datos.filter(r => (r["Asistencia"] || "").includes("decidido")).length;
      const ninos = datos.reduce((s, r) => s + (parseInt(r["Niños"]) || 0), 0);

      // Personas = asisten + sus acompañantes (los que dijeron Sí a acompañante)
      const acompanantes = datos.filter(r =>
        (r["Asistencia"] || "").includes("asistiré") && r["Acompañante"] === "Sí"
      ).length;
      const personas = asisten + acompanantes;

      document.getElementById("stat-total").textContent = total;
      document.getElementById("stat-asisten").textContent = asisten;
      document.getElementById("stat-no").textContent = no;
      document.getElementById("stat-pendiente").textContent = pend;
      document.getElementById("stat-personas").textContent = personas;
      document.getElementById("stat-ninos").textContent = ninos;
    }

    function filtrar(valor, btn) {
      filtroActual = valor;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      if (valor === "todos") {
        renderTabla(todosLosDatos);
      } else {
        renderTabla(todosLosDatos.filter(r => (r["Asistencia"] || "") === valor));
      }
    }

    function exportarCSV() {
      if (todosLosDatos.length === 0) return alert("No hay datos para exportar");
      const headers = ["Fecha", "Nombre", "Email", "Asistencia", "Acompañante", "Nombre Acompañante", "Niños", "Restricciones", "Mensaje"];
      const rows = todosLosDatos.map(r => headers.map(h => `"${(r[h] || "").toString().replace(/"/g, '""')}"`).join(","));
      const csv = [headers.join(","), ...rows].join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url;
      a.download = "confirmaciones_boda.csv"; a.click();
    }

    // Cargar al abrir la página
    cargarDatos();
  </script>
</body>

</html>
